<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The build writes a script here that applies the stored or system theme before anything is painted (vite.config.ts). -->
    <!--first-paint-->
    <meta name="description" content="StrataLab: a physical geology explorer and virtual lab for self-directed learners. Deep time, close up." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png" />
    <meta property="og:title" content="StrataLab" />
    <meta property="og:description" content="A free, open-source physical geology explorer and virtual lab in your browser, with no account needed." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preload" href="./fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/zilla-slab-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://earthquake.usgs.gov" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <title>StrataLab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
